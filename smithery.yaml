# Smithery config (legacy GitHub-repo deploy format; still read for repo-linked servers).
# Smithery's current path for local stdio servers is an MCPB bundle (manifest.json -> server.mcpb,
# then `smithery mcp publish ./server.mcpb -n <namespace>/dyoe-trust-mcp`); see PUBLISH-STEPS.md.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      walletPrivateKey:
        type: string
        title: Base wallet private key (optional)
        description: >-
          Private key of a DEDICATED, low-balance Base wallet holding USDC. Each tool call pays its
          x402 price from it. Never use your main wallet. Leave empty for free PREVIEW mode, which
          returns the 402 payment requirements instead of paying.
      maxPaymentUsd:
        type: number
        title: Max payment per call (USD)
        default: 0.1
        description: Calls priced above this are refused locally. /review costs $15.
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'dyoe-trust-mcp'],
      env: {
        ...(config.walletPrivateKey ? { WALLET_PRIVATE_KEY: config.walletPrivateKey } : {}),
        ...(config.maxPaymentUsd != null ? { DYOE_MAX_PAYMENT_USD: String(config.maxPaymentUsd) } : {})
      }
    })
  exampleConfig: {}
